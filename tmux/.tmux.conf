# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
set -g @is_vim "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell '#{@is_vim}' 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell '#{@is_vim}' 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell '#{@is_vim}' 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell '#{@is_vim}' 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell '#{@is_vim}' 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# use mouse
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -sg escape-time 50
set -g detach-on-destroy off
set -g renumber-windows on

# Set true colors
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g focus-events on

# refresh
bind r source ~/.config/tmux/tmux.conf

#sessions
bind-key h choose-session

# workmux agent dashboard
#
bind-key g display-popup -b none -h 100% -w 100% -s 'bg=#191724,fg=#e0def4' -S 'bg=#191724,fg=#6e6a86' -E "workmux dashboard"
bind-key G run-shell "workmux sidebar"

# pane splitting
bind o split-window -h
bind p split-window -v

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# close pane
bind q kill-pane

# Status Bar Position and Update Interval
set -g status-position bottom            
set -g status-interval 2

# Window Status Format (Normal and Current)
set -g window-status-format '#[bg=#191724,fg=#c4a7e7]#[bg=#c4a7e7,fg=#191724]#I #[bg=#191724,fg=#e0def4] #{pane_current_command}#[bg=#191724,fg=#191724]'
set -g window-status-current-format '#[bg=#191724,fg=#eb6f92]#[bg=#eb6f92,fg=#191724]#I #[bg=#191724,fg=#e0def4] #{pane_current_command}#[bg=#191724,fg=#191724]'

# Status Bar Styling (Transparent Background)
set -g status-style bg=#191724,fg=#e0def4  
set -g window-status-style bg=#191724,fg=#e0def4  
set -g window-status-current-style bg=#191724,fg=#31748f  

# Status Right - Time, User, Hostname with Icons
set -g status-right-length 120
set -g status-right '#[bg=#191724,fg=#9ccfd8]#[bg=#9ccfd8,fg=#191724] #[bg=#191724,fg=#e0def4] #(whoami)#[bg=#191724,fg=#191724] #[bg=#191724,fg=#9ccfd8]#[bg=#9ccfd8,fg=#191724] #[bg=#191724,fg=#e0def4] #(date +"%b %_d %H:%M") '

#kStatus Left - Tmux Icon
set -g status-left ''

# Pane Border Styling
set -g pane-border-style fg=#6e6a86
set -g pane-active-border-style fg=#31748f

# Message Command Style (When You Run Commands in Tmux)
set -g message-style bg=#191724,fg=#31748f

# Clock Mode Styling (When Showing the Clock in a Pane)
set -g clock-mode-style 24

# Use the active theme background in popups
set -gw popup-style 'bg=#191724,fg=#e0def4'
