mode: session
base_branch: auto
merge_strategy: merge
window_prefix: "{project}-"
agent: opencode

panes:
  - focus: true

sandbox:
  enabled: true
nerdfont: true

dashboard:
  layout: stacked
  preview_size: 75

sidebar:
  width: 15%

theme:
  custom:
    bg: black
    fg: white
    accent: blue
    success: green
    warning: yellow
    error: red
